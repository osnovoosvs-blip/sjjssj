name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack zip if pom.xml is missing
        run: |
          if [ -z "$(find . -name pom.xml -not -path '*/target/*' | head -n 1)" ]; then
            # Ищем любые zip, в том числе "Name (1).zip", "Name (2).zip".
            # Берём архив с наибольшим номером в скобках (без номера = 0).
            ZIP=$(find . -iname '*.zip' -not -path './.git/*' | while IFS= read -r z; do
              n=$(printf '%s' "$z" | grep -oE '\([0-9]+\)' | tail -n1 | tr -dc '0-9')
              echo "${n:-0}|$z"
            done | sort -t'|' -k1,1n | tail -n1 | cut -d'|' -f2-)
            if [ -n "$ZIP" ]; then
              echo "Распаковываю: $ZIP"
              mkdir -p unpacked
              unzip -o -q "$ZIP" -d unpacked
            fi
          fi

      - name: Find pom.xml
        id: pom
        run: |
          POM=$(find . -name pom.xml -not -path '*/target/*' | head -n 1)
          if [ -z "$POM" ]; then
            echo "::error::pom.xml не найден ни в репозитории, ни в zip."
            exit 1
          fi
          echo "path=$POM" >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn -B -f "${{ steps.pom.outputs.path }}" package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrivateBlocks
          path: '**/target/PrivateBlocks-*.jar'
